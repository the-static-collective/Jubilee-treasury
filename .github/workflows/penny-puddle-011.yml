name: Jubilee RELAY-011 contextual permission and win-win search
on:
  push:
    paths:
      - 'labs/penny-puddle-011/**'
      - '.github/workflows/penny-puddle-011.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-011/**'
      - '.github/workflows/penny-puddle-011.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix labs/penny-puddle-011
      - run: npm run demo --prefix labs/penny-puddle-011
      - run: node --check labs/penny-puddle-011/context.mjs
      - run: node --check labs/penny-puddle-011/weave.mjs
      - run: node --check labs/penny-puddle-011/ui.mjs
      - run: node --check labs/penny-puddle-011/server.mjs
