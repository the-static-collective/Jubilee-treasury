name: PENNY x PUDDLE-009 Anchor / need satisfaction
on:
  push:
    paths:
      - 'labs/penny-puddle-009/**'
      - '.github/workflows/penny-puddle-009.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-009/**'
      - '.github/workflows/penny-puddle-009.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix labs/penny-puddle-009
      - run: npm run demo --prefix labs/penny-puddle-009
      - run: node --check labs/penny-puddle-009/ui.mjs
      - run: node --check labs/penny-puddle-009/server.mjs
