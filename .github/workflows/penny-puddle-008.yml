name: PENNY x PUDDLE-008 Angel replenishment
on:
  push:
    paths:
      - 'labs/penny-puddle-008/**'
      - '.github/workflows/penny-puddle-008.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-008/**'
      - '.github/workflows/penny-puddle-008.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix labs/penny-puddle-008
      - run: npm run demo --prefix labs/penny-puddle-008
      - run: node --check labs/penny-puddle-008/ui.mjs
      - run: node --check labs/penny-puddle-008/server.mjs
