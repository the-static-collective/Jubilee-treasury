name: Jubilee CONCORD-014 / generate agreement structures
on:
  push:
    paths:
      - 'labs/penny-puddle-014/**'
      - '.github/workflows/penny-puddle-014.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-014/**'
      - '.github/workflows/penny-puddle-014.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix labs/penny-puddle-014
      - run: npm run demo --prefix labs/penny-puddle-014
      - run: node --check labs/penny-puddle-014/composer.mjs
      - run: node --check labs/penny-puddle-014/planner.mjs
      - run: node --check labs/penny-puddle-014/demo.mjs
      - run: node --check labs/penny-puddle-014/ui.mjs
      - run: node --check labs/penny-puddle-014/server.mjs
