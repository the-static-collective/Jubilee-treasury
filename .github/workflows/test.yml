name: Portable protocol tests
on:
  push:
    branches: [main, experiment/portable-needs-survive-host-loss-001, experiment/native-capacity-routing-002]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unit tests
        run: npm test
      - name: Portable host-loss demo
        run: npm run demo
      - name: Native Garden SQL, hostile admission and crash reconstruction
        run: npm run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: routing-002-local-evidence
          path: dist/routing-002/
