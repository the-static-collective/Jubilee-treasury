name: Portable protocol tests
on:
  push:
    branches: [main, experiment/portable-needs-survive-host-loss-001]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Portable host-loss demo
        run: npm run demo
      - name: Living capacity economics demo
        run: npm run economics:demo
