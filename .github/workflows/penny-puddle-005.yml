name: PENNY x PUDDLE-005 discovery decision frontier
on:
  push:
    paths:
      - 'labs/penny-puddle-005/**'
      - '.github/workflows/penny-puddle-005.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-005/**'
      - '.github/workflows/penny-puddle-005.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test --prefix labs/penny-puddle-005
      - run: npm run demo --prefix labs/penny-puddle-005
      - run: node --check labs/penny-puddle-005/opportunity.mjs
      - run: node --check labs/penny-puddle-005/bridge.mjs
