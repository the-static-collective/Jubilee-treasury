name: Jubilee CAPABILITY-016 / independent candidate laboratory
on:
  push:
    paths:
      - 'labs/penny-puddle-016/**'
      - '.github/workflows/penny-puddle-016.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-016/**'
      - '.github/workflows/penny-puddle-016.yml'
permissions:
  contents: read
jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix labs/penny-puddle-016
      - run: npm run demo --prefix labs/penny-puddle-016
      - run: node --check labs/penny-puddle-016/laboratory.mjs
      - run: node --check labs/penny-puddle-016/verify.mjs
