name: PENNY x PUDDLE-006 worth-to-whom direct exchange
on:
  push:
    paths:
      - 'labs/penny-puddle-006/**'
      - '.github/workflows/penny-puddle-006.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-006/**'
      - '.github/workflows/penny-puddle-006.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test --prefix labs/penny-puddle-006
      - run: npm run demo --prefix labs/penny-puddle-006
      - run: node --check labs/penny-puddle-006/ui.mjs
      - run: node --check labs/penny-puddle-006/server.mjs
