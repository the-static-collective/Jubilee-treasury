name: PENNY × PUDDLE-004 rare coin value discovery
on:
  push:
    paths:
      - 'labs/penny-puddle-004/**'
      - '.github/workflows/penny-puddle-004.yml'
  pull_request:
    paths:
      - 'labs/penny-puddle-004/**'
      - '.github/workflows/penny-puddle-004.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test --prefix labs/penny-puddle-004
      - run: npm run demo --prefix labs/penny-puddle-004
      - run: node --check labs/penny-puddle-004/collector.mjs
      - run: node --check labs/penny-puddle-004/triage.mjs
